site_name: Blurzy documentation
site_description: Setup, workflows, and architecture for the Blurzy desktop video application.
site_url: https://CodeRSTech.github.io/Blurzy/docs/
repo_url: https://github.com/CodeRSTech/Blurzy
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site/docs

theme:
  name: darkly

hooks:
  - scripts/docs_reference.py

plugins:
  - search
  - mermaid2:
      version: 12.1.0
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          load_external_modules: false
          options:
            allow_inspection: false
            docstring_style: google
            inherited_members: false
            filters: ["!^_", "^__init__$"]
            show_if_no_docstring: true
            show_signature_annotations: true
            show_root_heading: false
            show_source: false
            heading_level: 2

extra_css:
  - stylesheets/reference.css

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Development: development.md
  - Architecture: architecture.md
  - Reference:
      - Overview: reference/index.md
  - Engineering:
      - Documentation style: engineering/documentation-style.md
      - Defensive guards: engineering/defensive-guards.md
  - Planning (proposals):
      - About these notes: planning/README.md
      - Annotation workflow: planning/ideas/annotation-workflow-polish.md
      - Model providers: planning/ideas/model-provider-management.md
      - Project save and recovery: planning/ideas/project-save-and-recovery.md
      - Settings and preferences: planning/ideas/settings-and-preferences.md
      - Video transforms: planning/ideas/video-transform-controls.md
