site_name: Blurzy documentation
site_description: Setup, workflows, and architecture for the Blurzy desktop video application.
site_url: https://CodeRSTech.github.io/Blurzy/docs/
repo_url: https://github.com/CodeRSTech/Blurzy
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site/docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/icon.ico
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: orange
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

hooks:
  - scripts/docs_reference.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          load_external_modules: false
          options:
            allow_inspection: false
            docstring_style: google
            inherited_members: false
            filters: ["!^_", "^__init__$"]
            show_if_no_docstring: true
            show_signature_annotations: true
            show_root_heading: false
            show_source: false
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra_css:
  - stylesheets/reference.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Development: development.md
  - Architecture: architecture.md
  - Reference:
      - reference/index.md
  - API reference:
      - reference/api/index.md
  - Engineering:
      - Reference documentation: engineering/reference-documentation.md
      - Documentation style: engineering/documentation-style.md
      - Defensive guards: engineering/defensive-guards.md
  - Planning (proposals):
      - About these notes: planning/README.md
      - Re-ID roadmap: planning/ideas/reid-roadmap.md
      - Annotation workflow: planning/ideas/annotation-workflow-polish.md
      - Model providers: planning/ideas/model-provider-management.md
      - Project save and recovery: planning/ideas/project-save-and-recovery.md
      - Settings and preferences: planning/ideas/settings-and-preferences.md
      - Tracking and headless redaction: planning/ideas/tracking-and-headless-redaction.md
      - Video transforms: planning/ideas/video-transform-controls.md
