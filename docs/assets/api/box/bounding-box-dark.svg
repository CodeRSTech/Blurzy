<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Bounding box coordinates and view-model attributes</title>
  <desc id="desc">A sample object box on an image coordinate plane. Its top-left corner is x1, y1 at 120, 80 and its bottom-right corner is x2, y2 at 360, 260. A neighboring card shows the corresponding detection view-model attributes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="520" rx="20" fill="#0f172a"/>
  <text x="36" y="48" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">One box, two views</text>
  <text x="36" y="74" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">XYXY geometry in the frame → domain result → presentation model</text>

  <rect x="36" y="104" width="538" height="370" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="58" y="135" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Video frame (pixel coordinates)</text>
  <rect x="64" y="154" width="480" height="286" rx="5" fill="url(#grid)" stroke="#475569"/>
  <path d="M74 164H524" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M74 164V420" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="157" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">x</text>
  <text x="82" y="425" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">y</text>
  <text x="77" y="180" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">(0, 0)</text>

  <rect x="184" y="234" width="240" height="180" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="184" cy="234" r="5" fill="#60a5fa"/>
  <circle cx="424" cy="414" r="5" fill="#60a5fa"/>
  <path d="M184 234L139 204" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="93" y="176" width="98" height="30" rx="6" fill="#172554" stroke="#1e40af"/>
  <text x="105" y="196" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">(x1, y1)</text>
  <text x="194" y="228" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">(120, 80)</text>
  <path d="M424 414L457 400" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="454" y="374" width="88" height="30" rx="6" fill="#172554" stroke="#1e40af"/>
  <text x="464" y="394" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">(x2, y2)</text>
  <text x="351" y="431" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">(360, 260)</text>
  <text x="190" y="265" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">person</text>
  <text x="98" y="460" fill="#94a3b8" font-family="Consolas, monospace" font-size="14">BBoxXYXYTuple = (120, 80, 360, 260)</text>

  <path d="M588 287H631" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="270" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">mapped to</text>

  <rect x="650" y="104" width="274" height="370" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="674" y="136" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">BBoxViewModel</text>
  <text x="674" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">from DetectionResult</text>
  <path d="M674 178H900" stroke="#334155"/>
  <text x="674" y="207" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">id</text>
  <text x="900" y="207" text-anchor="end" fill="#f1f5f9" font-family="Consolas, monospace" font-size="13">"yolo-42"</text>
  <text x="674" y="245" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">source</text>
  <text x="900" y="245" text-anchor="end" fill="#f1f5f9" font-family="Consolas, monospace" font-size="13">DETECTION</text>
  <text x="674" y="283" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">label</text>
  <text x="900" y="283" text-anchor="end" fill="#f1f5f9" font-family="Consolas, monospace" font-size="13">"person"</text>
  <text x="674" y="321" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">bbox_xyxy</text>
  <text x="900" y="321" text-anchor="end" fill="#f1f5f9" font-family="Consolas, monospace" font-size="12">(120, 80, 360, 260)</text>
  <text x="674" y="359" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">color_hex / border</text>
  <rect x="674" y="373" width="18" height="18" rx="3" fill="#3b82f6"/>
  <text x="702" y="387" fill="#f1f5f9" font-family="Consolas, monospace" font-size="13">#3B82F6</text>
  <text x="674" y="427" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">confidence</text>
  <text x="900" y="427" text-anchor="end" fill="#f1f5f9" font-family="Consolas, monospace" font-size="13">0.93</text>
</svg>
