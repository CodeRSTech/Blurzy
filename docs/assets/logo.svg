<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="favCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="favMotion" x="-60%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="9 0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="18" y="18" width="220" height="220" rx="48" fill="url(#favBgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="18" y="18" width="220" height="220" rx="48" fill="none" stroke="url(#favCyanGrad)" stroke-width="3.5" filter="url(#favGlow)" opacity="0.85" />

  <!-- Speed Streaks / Velocity Streaks -->
  <g opacity="0.6">
    <line x1="28" y1="84" x2="78" y2="84" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <line x1="38" y1="128" x2="88" y2="128" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    <line x1="22" y1="172" x2="72" y2="172" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- Letter B with Motion Offset -->
  <g transform="translate(18, 0)">
    <!-- Motion blur ghost trail -->
    <path d="M 68,64 L 118,64 C 138,64 150,72 150,89 C 150,102 141,108 127,112 C 145,114 157,122 157,142 C 157,160 139,170 115,170 L 68,170 Z" fill="#38bdf8" opacity="0.45" filter="url(#favMotion)" transform="translate(-18, 0)" />

    <!-- Crisp Letter B -->
    <path d="M 68,64 L 118,64 C 138,64 150,72 150,89 C 150,102 141,108 127,112 C 145,114 157,122 157,142 C 157,160 139,170 115,170 L 68,170 Z M 92,84 L 92,106 L 117,106 C 124,106 130,100 130,95 C 130,90 124,84 117,84 Z M 92,126 L 92,150 L 118,150 C 127,150 133,144 133,138 C 133,132 127,126 118,126 Z" fill="url(#favCyanGrad)" filter="url(#favGlow)" />
  </g>

  <!-- Tracking Point Node on Border -->
  <circle cx="204" cy="198" r="7" fill="#00f2fe" filter="url(#favGlow)" />
  <circle cx="204" cy="198" r="3" fill="#ffffff" />
</svg>