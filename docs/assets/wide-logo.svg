<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 35 740 290"  width="100%" height="100%" style="font-family:&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Motion blur for text trails -->
    <filter id="bMotion" x="-50%" y="-30%" width="200%" height="160%">
      <feGaussianBlur stdDeviation="16 0.5" />
    </filter>

    <!-- Neon Glow -->
    <filter id="bGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Background Spotlight -->
    <radialGradient id="bannerSpotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e1e38" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#070c18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#04070f" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <!-- Viewfinder / Detection Bounding Box Corners -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
    <path d="M 120,95 L 120,65 L 150,65" fill="none" />
    <path d="M 810,65 L 840,65 L 840,95" fill="none" />
    <path d="M 840,265 L 840,295 L 810,295" fill="none" />
    <path d="M 150,295 L 120,295 L 120,265" fill="none" />
  </g>

  <!-- Technical Reticle & Center Ticks -->
  <g stroke="#00f2fe" stroke-width="1" opacity="0.2">
    <line x1="480" y1="45" x2="480" y2="60" />
    <line x1="480" y1="300" x2="480" y2="315" />
    <!-- Small Target Crosshairs -->
    <path d="M 770,180 L 790,180 M 780,170 L 780,190" />
  </g>

  <!-- Speed Stream Velocity Streaks -->
  <g opacity="0.55">
    <line x1="160" y1="145" x2="260" y2="145" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />
    <line x1="190" y1="180" x2="285" y2="180" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="140" y1="215" x2="255" y2="215" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Main Wordmark Center Block -->
  <g transform="translate(480, 205)">
    <!-- Chromatic Red Shift Blur -->
    <text x="-160" y="0" text-anchor="middle" font-size="94" font-weight="900" fill="#f43f5e" opacity="0.3" letter-spacing="4" filter="url(#bMotion)">BLUR</text>

    <!-- Chromatic Cyan Shift Blur -->
    <text x="-144" y="0" text-anchor="middle" font-size="94" font-weight="900" fill="#00f2fe" opacity="0.55" letter-spacing="4" filter="url(#bMotion)">BLUR</text>

    <!-- Main Text Front Layer -->
    <text x="0" y="0" text-anchor="middle" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="4">
      BLUR<tspan fill="url(#bCyanGrad)" filter="url(#bGlow)">ZY</tspan>
    </text>
  </g>

  <!-- Diminutive Metadata Tag on Corner of "ZY" -->
  <g transform="translate(685, 118)">
    <line x1="-12" y1="11" x2="0" y2="11" stroke="#0284c7" stroke-width="1" opacity="0.6" />
    <rect x="0" y="0" width="62" height="16" rx="3" fill="#0b1329" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="6" y="11" fill="#38bdf8" font-size="8" font-weight="700" letter-spacing="1" opacity="0.75">TRACK #01</text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="480" y="258" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600" letter-spacing="7">DESKTOP VIDEO ANONYMIZATION</text>
</svg>