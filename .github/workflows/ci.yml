name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libpulse0
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Qt imports
        run: python -c "from PySide6 import QtCore, QtGui, QtWidgets, QtMultimedia, QtOpenGL"
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
