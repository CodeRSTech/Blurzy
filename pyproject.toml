[build-system]
requires = [
    "setuptools>=68.1.2",
    "wheel>=0.42.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "blurzy"
version = "0.1.0"
description = "PySide6 desktop app for video detection, tracking, annotation, and subject blurring."
readme = "README.MD"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "loguru",
    "scipy",
    "numpy",
    "opencv-python",
    "Pillow",
    "ultralytics",
    "torch",
    "torchvision",
    "mtcnn",
    "facenet-pytorch",
    "pyyaml",
    "torch-utils",
    "pandas",
    "configparser",
    "PySide6",
    "av",
    "deep-sort-realtime",
]

[project.gui-scripts]
blurzy = "main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]
dist = [
    "build>=1.5.0",
    "pyinstaller>=6.22.0",
]

[project.urls]
Repository = "https://github.com/CodeRSTech/Blurzy-development"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.ui.qt" = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# The minimum Python version to target during linting and formatting.
[tool.ruff]
target-version = "py312"

# The standard maximum line length (matching Black's default).
line-length = 120

# Source directories to look for if your project layout is non-standard.
src = ["."]

# Files and directories that Ruff will entirely ignore.
exclude = [
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".selene",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Default enabled rule categories: Pyflakes (F) and a subset of pycodestyle (E).
select = ["E4", "E7", "E9", "F"]

# List of specific rule codes to ignore within the selected categories.
ignore = []

# Allow fixable rules to be corrected automatically.
# Use "none" if you want Ruff to only report issues without editing code.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Enforce double quotes everywhere (Black style). Options: "single", "double", "preserve"
quote-style = "double"

# Indent using 4 spaces. Options: "space", "tab"
indent-style = "space"

# Respect magic trailing commas to decide line breaks (Black style).
skip-magic-trailing-comma = false

# Set standard line endings. Options: "lf", "crlf", "cr", "native"
line-ending = "auto"

# Disable formatting code blocks inside docstrings by default.
docstring-code-format = false